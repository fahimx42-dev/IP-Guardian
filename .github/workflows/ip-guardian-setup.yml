
name: IP Guardian - Online App Builder

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ip-guardian-setup.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ip-guardian-build
  cancel-in-progress: false

jobs:
  setup-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create IP Guardian Website
        run: |
          mkdir -p web android/app/src/main/assets

          cat > web/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#080f1e">
            <title>IP Guardian</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;background:#080f1e;color:#e8f0ff;font-family:Arial,sans-serif}
              header{padding:22px;background:#101d34;border-bottom:1px solid #263955}
              h1{color:#48b5ff;margin:0}
              main{max-width:950px;margin:auto;padding:20px}
              .card{background:#111f37;padding:20px;border-radius:14px;margin:15px 0;border:1px solid #263955}
              input,button{padding:13px;border-radius:8px;border:0;font-size:15px}
              input{width:100%;background:#eaf2ff;margin:8px 0}
              button{background:#087ee8;color:white;cursor:pointer;margin:5px}
              pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#72d6ff}
              .muted{color:#9bb0cc}
            </style>
          </head>
          <body>
            <header>
              <h1>🛡️ IP Guardian</h1>
              <p class="muted">IP Intelligence & Network Dashboard</p>
            </header>
            <main>
              <div class="card">
                <h2>My Public IP</h2>
                <button onclick="myIP()">Detect My IP</button>
                <pre id="myip">Waiting...</pre>
              </div>
              <div class="card">
                <h2>IP Intelligence Lookup</h2>
                <input id="ip" placeholder="Enter IPv4 or IPv6 address">
                <button onclick="lookup()">Analyze IP</button>
                <pre id="result">Enter an IP address to begin.</pre>
              </div>
              <div class="card">
                <h2>DNS Lookup</h2>
                <input id="domain" placeholder="example.com">
                <button onclick="dns()">Check DNS</button>
                <pre id="dnsresult"></pre>
              </div>
              <div class="card">
                <h2>RDAP / WHOIS</h2>
                <input id="rdapip" placeholder="Enter IP address">
                <button onclick="rdap()">Lookup RDAP</button>
                <pre id="rdapresult"></pre>
              </div>
              <div class="card">
                <h2>Export Report</h2>
                <button onclick="exportJSON()">Download JSON</button>
              </div>
              <p class="muted">IP Guardian | Personal IP Intelligence</p>
            </main>
            <script>
              let lastData = {};

              async function myIP(){
                const el=document.getElementById('myip');
                el.textContent='Loading...';
                try{
                  const r=await fetch('https://ipwho.is/');
                  const d=await r.json();
                  lastData.myIP=d;
                  el.textContent=JSON.stringify(d,null,2);
                }catch(e){el.textContent='Connection error: '+e.message}
              }

              async function lookup(){
                const ip=document.getElementById('ip').value.trim();
                const el=document.getElementById('result');
                if(!ip){el.textContent='Enter an IP address';return}
                el.textContent='Analyzing...';
                try{
                  const r=await fetch('https://ipwho.is/'+encodeURIComponent(ip));
                  const d=await r.json();
                  lastData.lookup=d;
                  el.textContent=JSON.stringify(d,null,2);
                }catch(e){el.textContent='Lookup failed: '+e.message}
              }

              async function dns(){
                const domain=document.getElementById('domain').value.trim();
                const el=document.getElementById('dnsresult');
                if(!domain){el.textContent='Enter a domain';return}
                el.textContent='Checking DNS...';
                try{
                  const r=await fetch('https://dns.google/resolve?name='+encodeURIComponent(domain)+'&type=A');
                  const d=await r.json();
                  lastData.dns=d;
                  el.textContent=JSON.stringify(d,null,2);
                }catch(e){el.textContent='DNS error: '+e.message}
              }

              async function rdap(){
                const ip=document.getElementById('rdapip').value.trim();
                const el=document.getElementById('rdapresult');
                if(!ip){el.textContent='Enter an IP address';return}
                el.textContent='Loading RDAP...';
                try{
                  const r=await fetch('https://rdap.org/ip/'+encodeURIComponent(ip));
                  if(!r.ok)throw new Error('RDAP request failed');
                  const d=await r.json();
                  lastData.rdap=d;
                  el.textContent=JSON.stringify(d,null,2);
                }catch(e){el.textContent=e.message}
              }

              function exportJSON(){
                const blob=new Blob([JSON.stringify(lastData,null,2)],{type:'application/json'});
                const a=document.createElement('a');
                a.href=URL.createObjectURL(blob);
                a.download='ip-guardian-report.json';
                a.click();
                URL.revokeObjectURL(a.href);
              }
            </script>
          </body>
          </html>
          HTML

      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/java/com/ipguardian/app
          mkdir -p android/app/src/main/assets

          cp web/index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IPGuardian"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.ipguardian.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ipguardian.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="IP Guardian"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/ipguardian/app/MainActivity.java <<'EOF'
          package com.ipguardian.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: IP-Guardian-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Website
        uses: actions/deploy-pages@v4

      - name: Save Generated Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web android
          git diff --cached --quiet || git commit -m "Generate IP Guardian website and Android app"
          git push
