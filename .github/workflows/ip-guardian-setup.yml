name: IP Guardian One-Click Setup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ip-guardian-setup.yml"

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create IP Guardian project files
        shell: bash
        run: |
          mkdir -p backend web android/app/src/main/java/com/ipguardian/app

          cat > README.md <<'EOF'
          # IP Guardian
          Personal IP intelligence starter project: web dashboard, FastAPI backend, and Android WebView app.
          See `.env.example` for optional API configuration. Never commit real API keys.
          EOF

          cat > requirements.txt <<'EOF'
          fastapi==0.115.6
          uvicorn[standard]==0.34.0
          requests==2.32.3
          python-whois==0.9.5
          EOF

          cat > .env.example <<'EOF'
          SHODAN_API_KEY=
          EOF

          cat > backend/main.py <<'EOF'
          import ipaddress, socket
          import requests
          from fastapi import FastAPI, HTTPException
          from fastapi.middleware.cors import CORSMiddleware

          app = FastAPI(title="IP Guardian API", version="1.0.0")
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_methods=["*"], allow_headers=["*"])

          @app.get("/")
          def root():
              return {"app": "IP Guardian", "status": "online"}

          @app.get("/api/health")
          def health():
              return {"status": "ok"}

          @app.get("/api/my-ip")
          def my_ip():
              try:
                  return requests.get("https://api.ipify.org?format=json", timeout=10).json()
              except Exception as e:
                  raise HTTPException(502, str(e))

          @app.get("/api/ip/{address}")
          def lookup_ip(address: str):
              try:
                  ipaddress.ip_address(address)
                  r = requests.get(f"https://ipwho.is/{address}", timeout=15)
                  r.raise_for_status()
                  return r.json()
              except ValueError:
                  raise HTTPException(400, "Invalid IP address")
              except Exception as e:
                  raise HTTPException(502, str(e))

          @app.get("/api/dns/{hostname}")
          def dns(hostname: str):
              try:
                  return {"hostname": hostname, "addresses": sorted({x[4][0] for x in socket.getaddrinfo(hostname, None)})}
              except Exception as e:
                  raise HTTPException(400, str(e))

          @app.get("/api/subnet/{cidr:path}")
          def subnet(cidr: str):
              try:
                  n = ipaddress.ip_network(cidr, strict=False)
                  return {"network": str(n), "netmask": str(n.netmask), "broadcast": str(n.broadcast_address), "num_addresses": n.num_addresses}
              except ValueError:
                  raise HTTPException(400, "Invalid CIDR")
          EOF

          cat > web/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>IP Guardian</title>
          <style>
          *{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf2ff;font:16px system-ui}header{padding:26px 6%;background:#101f35;border-bottom:1px solid #29415f}h1{margin:0;color:#6ee7ff}main{max-width:1000px;margin:30px auto;padding:0 18px}.panel{background:#10213a;border:1px solid #29415f;border-radius:16px;padding:22px;margin:16px 0}input,button{padding:13px;border-radius:9px;border:1px solid #385574;background:#071729;color:white}input{width:min(100%,500px)}button{background:#087eaa;cursor:pointer;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a7f3d0}.muted{color:#9bb0c9}
          </style></head><body><header><h1>IP Guardian</h1><div class="muted">Personal IP Intelligence Dashboard</div></header><main>
          <section class="panel"><h2>IP Lookup</h2><input id="ip" placeholder="Enter an IP address"><button onclick="lookup()">Analyze IP</button><button onclick="myip()">My IP</button><pre id="out">Results will appear here.</pre></section>
          <section class="panel"><h2>DNS Lookup</h2><input id="host" placeholder="example.com"><button onclick="dns()">Resolve DNS</button></section>
          <section class="panel"><h2>Subnet Calculator</h2><input id="cidr" placeholder="192.168.1.0/24"><button onclick="subnet()">Calculate</button></section>
          <script>
          const API=location.hostname==='localhost'?'http://localhost:8000':'';
          async function call(path){let r=await fetch(API+path);let j=await r.json();document.getElementById('out').textContent=JSON.stringify(j,null,2)}
          function lookup(){call('/api/ip/'+encodeURIComponent(document.getElementById('ip').value))}
          function myip(){call('/api/my-ip')}
          function dns(){call('/api/dns/'+encodeURIComponent(document.getElementById('host').value))}
          function subnet(){call('/api/subnet/'+encodeURIComponent(document.getElementById('cidr').value))}
          </script></main></body></html>
          EOF

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IPGuardian"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ipguardian.app'
              compileSdk 35
              defaultConfig { applicationId 'com.ipguardian.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="IP Guardian" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/ipguardian/app/MainActivity.java <<'EOF'
          package com.ipguardian.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
          }
          EOF

          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Commit generated project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md requirements.txt .env.example backend web android
          git commit -m "Generate IP Guardian project" || echo "No changes to commit"
          git push

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Guardian-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
